# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: bcilab
    model: bcilab-flash
    reasoningEffort: max
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: both
    process: detailed
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      aixj:
        displayName: ChatGPT
        apiKeyEnv: AIXJ_API_KEY
        api: openai-completions
        baseURL: https://aixj.vip/v1
        models:
          - id: GPT-6.1Sol
            name: GPT-6.1Sol
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            compat:
              chatTemplateKwargs: {}
              chatTemplateArgs: {}
          - id: gpt-6-astra
            name: GPT-6 Astra
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            compat:
              chatTemplateKwargs: {}
              chatTemplateArgs: {}
      aixj-claude:
        displayName: Claude
        apiKeyEnv: AIXJ_CLAUDE_API_KEY
        api: openai-completions
        baseURL: https://aixj.vip/v1
        models:
          - id: claude-opus-5-5
            name: claude-opus-5-5
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            compat:
              chatTemplateKwargs: {}
              chatTemplateArgs: {}
          - id: claude-sonnet-5-5
            name: claude-sonnet-5-5
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            compat:
              chatTemplateKwargs: {}
              chatTemplateArgs: {}
      bcilab:
        displayName: BCILab 实验室网关
        apiKeyEnv: BCILAB_API_KEY
        api: openai-completions
        baseURL: http://10.101.170.65:18080/v1
        models:
          - id: bcilab-flash
            name: MiniMax 3.1 Flash
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
            compat:
              chatTemplateKwargs: {}
              chatTemplateArgs: {}
      deepseek:
        apiKeyEnv: DEEPSEEK_API_KEY
        models:
          - id: deepseek-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
              - image
          - id: deepseek-v4-pro
            name: DeepSeek V4 Pro
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    retryPolicy:
      mode: normal
      retryableCodes:
        - EMPTY_RESPONSE
        - RATE_LIMIT
        - SERVER
        - TIMEOUT
        - TRANSPORT
        - MALFORMED_RESPONSE
    models: []
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  config:
    enabled: false
- id: thinking-effort
  name: "@hytime/dsh-thinking-effort"
  config:
    subagentEffort: low
- id: thinking-effort
  disabled: true
- id: llm-deepseek-account
  name: "@deepseek-ai/dsh-llm-deepseek-account"
  config:
    retryPolicy:
      mode: normal
      retryableCodes:
        - EMPTY_RESPONSE
        - RATE_LIMIT
        - SERVER
        - TIMEOUT
        - TRANSPORT
        - MALFORMED_RESPONSE
    models:
      - id: deepseek-flash
        name: DeepSeek-V41-Flash
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        systemPromptUpdate: in-history
        toolUpdate: addition-only
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited
          to complex or quality-critical tasks at higher cost.
        contextWindow: 1000000
        inputModalities:
          - text
          - image
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: codex-history
  name: 'dsh-codex-history'
  config:
    share:
      enabled: true
      dir: 'D:\CodexShare'
      machineId: 'desktop'
      label: '台式机'
      mirrorCodex: true
      mirrorDsh: true
      intervalMs: 30000
      discoverIntervalMs: 15000
- id: dsh-ops-shell
  name: dsh-ops/shell
  config:
    promptPolicy: true
    publishBashTool: true
    shellPolicy: advise
    allowSystemShellFallback: false
    configUpdateVersion: 2
- id: dsh-ops-file
  name: dsh-ops/file
  config:
    promptPolicy: true
    required: false
    configUpdateVersion: 2
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
